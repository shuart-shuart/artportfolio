<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opps...</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* Simple toast */
    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      padding: 20vw 20vh;
      background: #333;
      color: #fff;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      opacity: 0;
      text-align: center;
      transition: opacity .5s ease;
      z-index: 9999;
    }
    .toast.show { opacity: 1; }
    /* Minimal page fallback */
    body { margin: 0; padding: 80px 16px 16px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    a { color: #0b5fff; }
  </style>
</head>
<body>

<div id="navbar"></div>
  <script>
    fetch("/navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
  </script>
  
  <div id="toast" class="toast" role="status" aria-live="polite">
    This link is broken — the page you’re looking for doesn’t exist. <br><br>Redirecting in 5 secs…
  </div>

  <noscript>
    <p>This link is broken — the page you’re looking for doesn’t exist.</p>
    <p><a href="/artportfolio/Index.html">Go to the homepage</a></p>
  </noscript>

  <script>
    (function () {
      var toast = document.getElementById('toast');
      // show toast
      requestAnimationFrame(function(){ toast.classList.add('show'); });
      // redirect after 5s
      setTimeout(function () {
        window.location.replace('/artportfolio/Index.html');
      }, 5000);
    })();
  </script>

<div id="footer"></div>
  <script>
    fetch("/footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
    
</body>
</html>
